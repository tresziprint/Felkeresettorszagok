<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utazásaim - Főmenü</title>
    <style>
        * { box-sizing: border-box; }
        
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Halvány, vintage koffer/bőr textúra hatás CSS-ből */
            background-color: #d7ccc8;
            background-image: radial-gradient(rgba(0,0,0,0.05) 15%, transparent 16%),
                              radial-gradient(rgba(0,0,0,0.05) 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* --- VINTAGE KOFFER MATRICÁK EGYMÁS HEGYÉN-HÁTÁN --- */
        .stickers-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none; /* Nem zavarja a gombokra kattintást */
            opacity: 0.4; /* Halványított dizájn, hogy olvasható legyen a menü */
        }

        .sticker {
            position: absolute;
            padding: 15px 25px;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 2px;
            border: 4px dashed rgba(255,255,255,0.8);
            box-shadow: 3px 3px 10px rgba(0,0,0,0.2);
            color: white;
            text-transform: uppercase;
        }

        /* Egyedi matricák pozíciói és formái */
        .st-1 { top: 10%; left: 15%; background: #c0392b; transform: rotate(-15deg); border-radius: 50%; padding: 30px 20px; }
        .st-2 { top: 15%; right: 12%; background: #2980b9; transform: rotate(10deg); border-radius: 5px; }
        .st-3 { bottom: 15%; left: 8%; background: #27ae60; transform: rotate(25deg); }
        .st-4 { bottom: 20%; right: 18%; background: #d35400; transform: rotate(-8deg); border-radius: 15px; }
        .st-5 { top: 45%; left: 5%; background: #8e44ad; transform: rotate(12deg); border-radius: 50% 0 50% 0; }
        .st-6 { bottom: 45%; right: 5%; background: #16a085; transform: rotate(-20deg); }
        .st-7 { top: 5%; left: 45%; background: #7f8c8d; transform: rotate(5deg); font-size: 11px; }

        /* --- FŐMENÜ TARTALOM --- */
        .menu-card {
            position: relative;
            z-index: 10;
            text-align: center;
            background: rgba(255, 255, 255, 0.85);
            padding: 50px 60px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            backdrop-filter: blur(5px); /* Modern üveghatás */
            border: 2px solid rgba(255,255,255,0.5);
            max-width: 90%;
            width: 650px;
        }

        h1 {
            font-size: 3.5rem;
            margin: 0 0 40px 0;
            color: #3e2723; /* Koffer-barna szín */
            letter-spacing: 6px;
            font-weight: 900;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            border-bottom: 3px double #3e2723;
            padding-bottom: 15px;
        }

        .button-container {
            display: flex;
            gap: 25px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .menu-btn {
            flex: 1;
            min-width: 220px;
            padding: 25px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
        }

        /* Bal oldali gomb: Országok (Klasszikus földgömb kék) */
        .btn-left {
            background: #2e7d32;
        }
        .btn-left:hover {
            background: #1b5e20;
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(27,94,32,0.4);
        }

        /* Jobb oldali gomb: Részletes (Iránytű / Kalandor narancs-barna) */
        .btn-right {
            background: #d84315;
        }
        .btn-right:hover {
            background: #bf360c;
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(191,54,12,0.4);
        }

        .btn-desc {
            font-size: 0.85rem;
            font-weight: normal;
            opacity: 0.85;
            margin-top: 4px;
        }

        .icon {
            font-size: 2rem;
        }
    </style>
</head>
<body>

    <!-- Halvány koffer matricák a háttérben -->
    <div class="stickers-container">
        <div class="sticker st-1"><span class="icon">✈️</span> PASSPORT</div>
        <div class="sticker st-2">PARIS 1998</div>
        <div class="sticker st-3">LONDON</div>
        <div class="sticker st-4">NEW YORK</div>
        <div class="sticker st-5">ROME</div>
        <div class="sticker st-6"><span class="icon">🌍</span> TRAVEL</div>
        <div class="sticker st-7">BOARDING PASS</div>
    </div>

    <!-- Központi menü kártya -->
    <div class="menu-card">
        <h1>UTAZÁSAIM</h1>
        
        <div class="button-container">
            <!-- FIGYELEM: A href="..." részeket írd át a saját fájlneveidre ha másképp nevezted el őket! -->
            <a href="orszagok.html" class="menu-btn btn-left">
                <span class="icon">🌍</span>
                <span>Országok</span>
                <span class="btn-desc">Csak az országok listája és statisztikák</span>
            </a>
            
            <a href="reszletes.html" class="menu-btn btn-right">
                <span class="icon">📍</span>
                <span>Részletes nézet</span>
                <span class="btn-desc">Fotók, pontos koordináták és térkép</span>
            </a>
        </div>
    </div>

</body>
</html>
